version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # First, because Dependabot puts a dependency in the first group it
      # matches. A new @milepost/* version is a contract interface change and
      # should arrive as its own PR, not inside a batch of tooling bumps.
      milepost-bindings:
        patterns:
          - "@milepost/*"
      # Minor and patch updates only. A major version arrives as its own PR, so
      # one that needs work cannot hold back a batch of safe updates.
      frontend-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint only supports TypeScript below 6.1. Remove once a
      # typescript-eslint release accepts the next TypeScript major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # CI runs Node 24, so the types should describe that runtime. Remove when
      # the Node version moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-dependencies:
        patterns:
          - "*"
