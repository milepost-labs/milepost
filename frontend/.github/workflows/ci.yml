name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # eslint requires ^20.19 || ^22.13 || >=24; vite wants >=22.12.
          node-version: 24
          cache: npm

      # @milepost/* comes from npm at the versions package.json pins. Whether
      # the app still works against contract changes that have not been
      # released is checked in milepost, whose `bindings` job builds this
      # repository against the bindings from each of its PRs.
      - name: Install
        run: npm ci

      # `tsc -b && vite build`, so type errors fail here.
      - name: Build
        run: npm run build

      - name: Enforce bundle size budget
        run: ./scripts/check-bundle-size.sh >> "$GITHUB_STEP_SUMMARY"

      # Not cosmetic. The React Compiler rules here catch render-purity and
      # cascading-setState bugs that type-check cleanly and misbehave at
      # runtime.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Every route, both themes, against axe; the contracts and the index are
      # mocked. See src/test/accessibility.test.tsx.
      - name: Accessibility checks
        run: npm run test:a11y

      # The app builds and signs transactions, so a compromised production
      # dependency reaches transaction construction. The failure policy is
      # deliberate and documented in scripts/check-npm-advisories.sh.
      - name: Check npm dependencies for known advisories
        run: ./scripts/check-npm-advisories.sh

  screenshots:
    name: Visual regression screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Download the pinned Chromium revision Playwright ships with.
      # --with-deps installs OS-level shared libraries in the same step.
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # Build the app in fixture mode so the screenshot server has a static
      # bundle to serve.  The indexer stub starts in global-setup.ts.
      - name: Run screenshot tests
        run: npm run screenshots

      # On a mismatch Playwright writes a diff image next to the failing
      # snapshot.  Attach the whole report so reviewers can inspect it without
      # re-running the job.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Attach the diff images themselves so they appear directly in the PR
      # check detail without opening the full report.
      - name: Upload snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: tests/screenshots/**/*-diff.png
          retention-days: 14
          if-no-files-found: ignore
