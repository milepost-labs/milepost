<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Milepost app</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"><style>:root,[data-theme="light"]{--bg:#f5f2ea;--bg-raised:#fbf9f4;--bg-sunken:#ebe6da;--ink:#16140f;--ink-muted:#585346;--ink-faint:#8c8675;--line:#ddd6c6;--accent:#0a6b47;--accent-hover:#07573a;--accent-ink:#ffffff;--accent-soft:#d3e7d9;--signal:#f0b928;--signal-ink:#1d1606;--money-unawarded:var(--accent-soft);--money-locked:#b7b2a3;--money-released:var(--accent);--money-refundable:#c2532a;--danger:#b3261e;--danger-soft:#f6dcd6;--focus:#16140f;--shadow-1:0 1px 2px rgba(22,20,15,0.06), 0 4px 16px rgba(22,20,15,0.06);--shadow-2:0 12px 40px rgba(22,20,15,0.14);}[data-theme="dark"]{--bg:#0e1210;--bg-raised:#161b18;--bg-sunken:#090c0a;--ink:#eef0e9;--ink-muted:#a6ada4;--ink-faint:#68716a;--line:#252c28;--accent:#3fcf8e;--accent-hover:#66dca6;--accent-ink:#04120b;--accent-soft:#1b3a2c;--signal:#f3c443;--signal-ink:#1d1606;--money-unawarded:var(--accent-soft);--money-locked:#4a524c;--money-released:var(--accent);--money-refundable:#e67b4f;--danger:#f2867c;--danger-soft:#3a1a17;--focus:#f3c443;--shadow-1:0 1px 2px rgba(0,0,0,0.4), 0 6px 20px rgba(0,0,0,0.35);--shadow-2:0 16px 48px rgba(0,0,0,0.55);}:root{--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;--space-16:64px;--space-24:96px;--space-32:128px;--radius-sq:3px;--radius-sm:8px;--radius-md:14px;--radius-lg:28px;--radius-pill:999px;--font-display:"Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;--font-sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;--font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;}*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
a{color:inherit}
fieldset{min-width:0}
.dgrid>*,.vgrid>*,.wizard>*{min-width:0}
svg{width:18px;height:18px;flex:none;vertical-align:middle}
.link svg{width:16px;height:16px}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.02em;font-weight:650}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--space-8)}
.muted{color:var(--ink-muted)}
.eyebrow{font:500 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--radius-pill);border:0;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--bg-sunken);color:var(--ink)}
.btn-secondary:hover{background:color-mix(in srgb,var(--bg-sunken) 80%,var(--ink))}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-ghost:hover{background:var(--bg-sunken)}
.btn-danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--danger) 40%,transparent)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-sm{min-height:36px;padding:0 14px;font-size:14px}
.btn[aria-disabled="true"],.btn:disabled{background:var(--bg-sunken);color:var(--ink-faint);cursor:not-allowed;box-shadow:none}
.btn-block{width:100%}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--bg-sunken)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.sm{width:32px;height:32px}
.icon-btn.sm svg{width:15px;height:15px}
.link{color:var(--accent);font-weight:600;text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.link:hover{text-decoration:underline}

/* ---------- badges / pills ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--radius-pill);font:500 12px/1 var(--font-mono);letter-spacing:.04em;white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor}
.ph-open{background:var(--accent-soft);color:var(--accent)}
[data-theme="dark"] .ph-open{color:var(--accent)}
.ph-review{background:color-mix(in srgb,var(--signal) 28%,var(--bg));color:var(--ink)}
.ph-review i{background:#a87a00}
[data-theme="dark"] .ph-review i{background:var(--signal)}
.ph-settled{background:var(--bg-sunken);color:var(--ink)}
.ph-settled i{background:var(--ink-muted)}
.ph-cancelled{background:var(--danger-soft);color:var(--danger)}
.ph-paused{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-muted)}
.mode{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;background:var(--bg-sunken);white-space:nowrap}
.mode .m{display:inline-flex;gap:2px}
.mode .m b{width:5px;height:5px;border-radius:1px;background:var(--ink);opacity:.2}
.mode .m b.f{background:var(--accent);opacity:1}
.tag-sample{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-pill);font:600 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;background:var(--signal);color:var(--signal-ink);background-image:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(0,0,0,.07) 6px 12px)}
.tag-testnet{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:var(--radius-pill);background:var(--bg-sunken);font:500 12px/1 var(--font-mono);white-space:nowrap}
.tag-testnet i{width:8px;height:8px;border-radius:50%;background:var(--signal)}
.chip-ok{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--accent);font-weight:600}
.chip-ok svg{width:14px;height:14px}

/* ---------- money squares ---------- */
.sq{width:10px;height:10px;border-radius:var(--radius-sq);background:var(--money-unawarded);display:inline-block;flex:none;transition:background .4s}
.sq.l{background:var(--money-locked)}
.sq.r{background:var(--money-released)}
.sq.f{background:var(--money-refundable)}
.sq.e{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.money{display:flex;flex-wrap:wrap;gap:3px}
.money.lg{gap:5px}
.money.lg .sq{width:16px;height:16px;border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- surfaces ---------- */
.panel{background:var(--bg-raised);border-radius:var(--radius-md);padding:var(--space-6)}
.panel.sunk{background:var(--bg-sunken)}
.panel h3{font-size:19px;letter-spacing:-.01em}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:var(--space-4);flex-wrap:wrap}

/* ---------- shell ---------- */
.banner-test{background:var(--ink);color:var(--bg);font-size:13px;text-align:center;padding:7px 16px}
.banner-test b{color:var(--signal)}
.banner-off{background:var(--danger-soft);color:var(--danger);font-size:14px;text-align:center;padding:8px 16px;font-weight:600}
header.app{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hd{display:flex;align-items:center;gap:var(--space-4);height:64px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font:700 19px/1 var(--font-display);letter-spacing:-.02em;flex:none}
.mark{display:flex;align-items:flex-end;gap:3px;height:20px}
.mark b{width:6px;border-radius:2px;display:block}
.mark b:nth-child(1){height:8px;background:var(--money-locked)}
.mark b:nth-child(2){height:14px;background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.mark b:nth-child(3){height:20px;background:var(--accent)}
nav.main{display:flex;gap:2px;margin-left:var(--space-6)}
nav.main a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:var(--radius-pill);text-decoration:none;font-weight:600;font-size:15px;color:var(--ink-muted)}
nav.main a svg{width:17px;height:17px}
nav.main a:hover{color:var(--ink);background:var(--bg-sunken)}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--bg-sunken)}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.acct{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 6px 0 14px;border-radius:var(--radius-pill);background:var(--bg-sunken);border:0;cursor:pointer}
.acct .av{width:32px;height:32px;border-radius:50%;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:7px;background:var(--bg)}
.acct .av b{border-radius:2px;background:var(--accent)}
.acct .av b:nth-child(2){background:var(--money-refundable)}
.acct .av b:nth-child(3){background:var(--money-locked)}
.acct .av b:nth-child(4){background:var(--accent-soft)}
.subnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.subnav a{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:var(--radius-pill);font-size:14px;font-weight:500;color:var(--ink-muted);text-decoration:none;white-space:nowrap}
.subnav a:hover{color:var(--ink)}
.subnav a[aria-current="page"]{color:var(--ink);background:var(--bg-raised);box-shadow:var(--shadow-1)}
.subnav a .soon{font:500 10px/1 var(--font-mono);margin-left:6px;opacity:.6}
.tabbar{display:none}
main{padding:var(--space-8) 0 var(--space-24);min-height:70vh}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-6);flex-wrap:wrap;margin-bottom:var(--space-8)}
.page-head h1{font-size:40px;line-height:1.05;letter-spacing:-.03em}
.page-head p{color:var(--ink-muted);margin-top:8px;max-width:62ch}

/* ---------- menus & sheets ---------- */
.pop{position:absolute;right:0;top:calc(100% + 8px);width:320px;background:var(--bg-raised);border-radius:var(--radius-md);box-shadow:var(--shadow-2);padding:var(--space-4);z-index:50}
.pop .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;font-size:14px}
.pop .row+.row{box-shadow:inset 0 1px 0 var(--line)}
.pop .menu-item{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 10px;border:0;background:none;border-radius:var(--radius-sm);cursor:pointer;font-weight:500;font-size:15px;text-align:left;text-decoration:none}
.pop .menu-item:hover{background:var(--bg-sunken)}
.pop .menu-item svg{width:18px;height:18px;color:var(--ink-muted)}
.scrim{position:fixed;inset:0;background:rgba(10,12,10,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--bg-raised);border-radius:var(--radius-lg);box-shadow:var(--shadow-2);padding:var(--space-8);animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:var(--space-6)}
.sheet-head h2{font-size:26px;line-height:1.1}
.steps-dots{display:flex;gap:6px;margin-bottom:var(--space-4)}
.steps-dots i{height:4px;flex:1;border-radius:4px;background:var(--line)}
.steps-dots i.on{background:var(--accent)}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--space-4)}
.field label,.lbl{font-size:14px;font-weight:600}
.field .help{font-size:13px;color:var(--ink-muted)}
.input,select.input,textarea.input{min-height:48px;padding:0 14px;border-radius:var(--radius-sm);border:0;background:var(--bg-sunken);box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s;width:100%}
textarea.input{padding:12px 14px;min-height:88px;resize:vertical}
.input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.input[aria-invalid="true"]{box-shadow:inset 0 0 0 2px var(--danger)}
.err-text{font-size:13px;color:var(--danger);font-weight:500}
.amount{display:flex;align-items:center;background:var(--bg-sunken);border-radius:var(--radius-md);padding:6px 16px 6px 20px;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s}
.amount:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.amount input{flex:1;min-width:0;border:0;background:transparent;font:500 36px/1.2 var(--font-mono);letter-spacing:-.02em;padding:8px 0;outline:none}
.amount .unit{font:500 16px/1 var(--font-mono);color:var(--ink-muted)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.presets button{min-height:36px;padding:0 14px;border-radius:var(--radius-pill);border:0;background:var(--bg-sunken);font:500 14px/1 var(--font-mono);cursor:pointer}
.presets button:hover{background:var(--accent-soft)}
.breakdown{margin-top:var(--space-4);font-size:14px}
.breakdown div{display:flex;justify-content:space-between;padding:8px 0}
.breakdown div+div{box-shadow:inset 0 1px 0 var(--line)}
.breakdown .tot{font-weight:600}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--radius-sm);background:var(--bg-sunken);cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--bg-sunken);border-radius:var(--radius-pill);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;min-height:40px;padding:0 16px;border-radius:var(--radius-pill);font-weight:600;font-size:14px;color:var(--ink-muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--bg-raised);color:var(--ink);box-shadow:var(--shadow-1)}
.seg .count{font:500 12px/1 var(--font-mono);opacity:.7}
.stepper{display:inline-flex;align-items:center;background:var(--bg-sunken);border-radius:var(--radius-pill);padding:4px}
.stepper button{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg-raised);cursor:pointer;font-size:20px;line-height:1}
.stepper output{min-width:56px;text-align:center;font:500 18px/1 var(--font-mono)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4);margin-bottom:var(--space-8)}
.stat{background:var(--bg-sunken);border-radius:var(--radius-md);padding:var(--space-4) var(--space-6) var(--space-6)}
.stat .k{font-size:13px;color:var(--ink-muted);font-weight:500}
.stat .v{font:500 28px/1.1 var(--font-mono);letter-spacing:-.02em;margin-top:10px}
.stat .v small{font-size:14px;color:var(--ink-muted);margin-left:4px}
.stat .s{font-size:13px;color:var(--ink-muted);margin-top:6px}
.stat.hl{background:var(--accent);color:var(--accent-ink)}
.stat.hl .k,.stat.hl .s,.stat.hl .v small{color:inherit;opacity:.8}

/* ---------- notices ---------- */
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--radius-md);font-size:14px;line-height:1.5}
.note svg{width:19px;height:19px;flex:none;margin-top:1px}
.note b{font-weight:600}
.note.info{background:var(--bg-sunken)}
.note.info svg{color:var(--ink-muted)}
.note.warn{background:color-mix(in srgb,var(--signal) 22%,var(--bg))}
.note.warn svg{color:#8a6400}
[data-theme="dark"] .note.warn svg{color:var(--signal)}
.note.risk{background:color-mix(in srgb,var(--money-refundable) 14%,var(--bg))}
.note.risk svg{color:var(--money-refundable)}
.note.ok{background:var(--accent-soft)}
.note.ok svg{color:var(--accent)}
.errpanel{padding:var(--space-6);border-radius:var(--radius-md);background:var(--danger-soft)}
.errpanel h4{font:600 17px/1.3 var(--font-sans);color:var(--ink);display:flex;gap:10px;align-items:center}
.errpanel h4 svg{width:20px;height:20px;color:var(--danger)}
.errpanel .code{margin-top:8px;font:500 13px/1.4 var(--font-mono);color:var(--danger)}
.errpanel .btn{margin-top:var(--space-4)}
.disabled-reason{font-size:13px;color:var(--ink-muted);display:flex;gap:6px;align-items:flex-start;margin-top:6px}
.disabled-reason svg{width:14px;height:14px;flex:none;margin-top:3px}

/* ---------- tx lifecycle ---------- */
.tx{text-align:center;padding:var(--space-6) 0}
.tx .ring{width:72px;height:72px;margin:0 auto var(--space-6);border-radius:50%;display:grid;place-items:center;position:relative}
.tx .ring.pending{background:var(--bg-sunken)}
.tx .ring.pending::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tx .ring.done{background:var(--accent);color:var(--accent-ink);animation:pop .5s cubic-bezier(.2,.9,.3,1.5)}
.tx .ring.fail{background:var(--danger-soft);color:var(--danger)}
.tx .ring svg{width:32px;height:32px}
@keyframes pop{from{transform:scale(.4)}}
.tx h3{font-size:24px}
.tx p{color:var(--ink-muted);margin-top:8px}
.tx-steps{display:flex;flex-direction:column;gap:8px;max-width:300px;margin:var(--space-6) auto 0;text-align:left;font-size:14px}
.tx-steps span{display:flex;gap:10px;align-items:center;color:var(--ink-muted)}
.tx-steps span.on{color:var(--ink);font-weight:600}
.tx-steps span.ok{color:var(--accent)}
.tx-steps svg{width:16px;height:16px}
.receipt{margin-top:var(--space-6);text-align:left;background:var(--bg-sunken);border-radius:var(--radius-md);padding:var(--space-4) var(--space-6)}
.receipt div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:14px}
.receipt div+div{box-shadow:inset 0 1px 0 var(--line)}
.receipt dt{color:var(--ink-muted)}
.receipt dd{margin:0;font-family:var(--font-mono);text-align:right}

/* ---------- loading / empty ---------- */
.skel{display:block;border-radius:var(--radius-sm);background:linear-gradient(90deg,var(--bg-sunken) 0%,var(--bg-raised) 50%,var(--bg-sunken) 100%);background-size:200% 100%;animation:sh 1.3s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:var(--space-16) var(--space-6)}
.empty .art{display:flex;gap:5px;justify-content:center;margin-bottom:var(--space-6)}
.empty .art i{width:18px;height:18px;border-radius:4px;box-shadow:inset 0 0 0 2px var(--line)}
.empty .art i:nth-child(3){box-shadow:none;background:var(--accent-soft)}
.empty h3{font-size:22px}
.empty p{color:var(--ink-muted);margin:8px auto 0;max-width:46ch}
.empty .btn{margin-top:var(--space-6)}

/* ---------- directory ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center;justify-content:space-between;margin-bottom:var(--space-4)}
.search{position:relative;flex:1;min-width:240px;max-width:380px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-muted)}
.search .input{padding-left:42px;border-radius:var(--radius-pill)}
.fresh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:13px;color:var(--ink-muted);margin-bottom:var(--space-6)}
.fresh .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.fresh.stale .dot{background:var(--signal)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4)}
.cards.two{grid-template-columns:repeat(2,1fr)}

/* ---------- programme detail ---------- */
.ph-head{display:grid;grid-template-columns:1fr auto;gap:var(--space-6);align-items:start}

.phasebar .ps{padding-top:14px;position:relative}

.phasebar span{font:500 12px/1.4 var(--font-mono);color:var(--ink-muted)}
.phasebar .ps.now b::after{content:" · now";color:var(--accent);font-weight:600}
.banner{display:flex;gap:14px;align-items:flex-start;padding:var(--space-4) var(--space-6);border-radius:var(--radius-md);margin-bottom:var(--space-6)}

.dgrid{display:grid;grid-template-columns:1fr 360px;gap:var(--space-6);align-items:start}

.actions{display:flex;flex-direction:column}

.tpost{position:relative}
.tpost .sign{width:48px;height:48px;border-radius:var(--radius-md);display:grid;place-items:center;font:600 17px/1 var(--font-mono);background:var(--bg-sunken);color:var(--ink-muted);position:relative;z-index:1}

.apptl span{font-size:13px;color:var(--ink-muted)}

/* ---------- verifier ---------- */
.vgrid{display:grid;grid-template-columns:1fr 420px;gap:var(--space-6);align-items:start}
.queue{display:flex;flex-direction:column;gap:6px}

.review{position:sticky;top:140px}

.att-status.valid{background:var(--accent-soft);color:var(--accent)}
.att-status.used{background:var(--bg-sunken);color:var(--ink-muted)}
.att-status.revoked{background:var(--danger-soft);color:var(--danger)}

/* ---------- deploy ---------- */
.wizard{display:grid;grid-template-columns:240px 1fr 320px;gap:var(--space-8);align-items:start}
.wsteps{list-style:none;margin:0;padding:0;position:sticky;top:140px}
.wsteps li button{display:flex;gap:12px;align-items:center;width:100%;min-height:52px;border:0;background:none;padding:0 10px;border-radius:var(--radius-sm);cursor:pointer;text-align:left;font-weight:600;color:var(--ink-muted)}
.wsteps li button:hover{background:var(--bg-sunken)}
.wsteps li button .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg-sunken);font:500 13px/1 var(--font-mono);flex:none}

.modechoice{display:flex;flex-direction:column;gap:8px}

.mc b{display:block;font-weight:600}
.mc span{font-size:13px;color:var(--ink-muted);display:block;margin-top:2px;line-height:1.45}
.mc .str{display:flex;gap:2px;margin-top:4px}
.mc .str i{width:14px;height:6px;border-radius:2px;background:var(--money-locked);opacity:.5}

.mc .best{position:absolute;top:-9px;right:14px;font:600 10px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:5px 8px;border-radius:var(--radius-pill)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.addr-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.addr-list div{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 6px 0 14px;border-radius:var(--radius-sm);background:var(--bg-sunken);font-size:14px}
.tl-visual{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:var(--space-4) 0 var(--space-6)}
.tl-visual div{height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;padding:0 10px;font:600 12px/1 var(--font-mono)}
.wiz-nav{display:flex;justify-content:space-between;gap:12px;margin-top:var(--space-8);padding-top:var(--space-6);box-shadow:inset 0 1px 0 var(--line)}
.config .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14px}
.config .row+.row{box-shadow:inset 0 1px 0 var(--line)}
.config .row span:first-child{color:var(--ink-muted)}

/* ---------- finalize ---------- */
.fin-top{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);margin-bottom:var(--space-6)}
.budgetbar{height:16px;border-radius:6px;background:var(--money-unawarded);overflow:hidden;display:flex;margin:var(--space-4) 0 10px}

.frow{display:grid;grid-template-columns:1.3fr .8fr 1.6fr .8fr 1.2fr;gap:var(--space-4);align-items:center;padding:16px var(--space-6);border-radius:var(--radius-md);background:var(--bg-raised)}
.frow+.frow{margin-top:6px}
.frow.hd{background:transparent;padding-top:0;padding-bottom:6px;font:500 12px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.frow .votes{display:flex;flex-wrap:wrap;gap:4px}

td.mono{white-space:nowrap}

.dock{position:fixed;left:16px;bottom:16px;z-index:40;background:var(--ink);color:var(--bg);border-radius:var(--radius-md);box-shadow:var(--shadow-2);font-size:13px;max-width:calc(100vw - 32px)}

}

function money(p, n=40, lg=false){
  const u = n / p.budget;
  let r = Math.round(p.released*u), f = Math.round(p.refundable*u), l = Math.round((p.awarded-p.released)*u);
  if (p.closed || p.phase==='cancelled') l = 0;
  let un = Math.max(0, n - r - f - l);
  if (p.closed || p.phase==='cancelled') { f = n - r; un = 0; }
  const sq = (c,k) => Array.from({length:k}, () => `<i class="sq ${c}"></i>`).join('');
  const label = `${fmt(p.budget)} ${p.asset} budget: ${fmt(p.released)} released, ${fmt(p.closed||p.phase==='cancelled'?0:p.awarded-p.released)} awarded and locked, ${fmt(p.refundable)} refundable`;
  return `<div class="money ${lg?'lg':''}" role="img" aria-label="${label}">${sq('r',r)}${sq('l',l)}${sq('f',f)}${sq('',un)}</div>`;
}

  ${p.paused?`<div class="banner pause" role="status" style="margin-top:var(--space-6)">${ic('pause')}<div><b>Paused by the creator.</b><p class="muted" style="font-size:14px;margin-top:2px">Actions are stopped, but the clock isn't: the review still ends on ${p.d[1]}.</p></div></div>`:''}

    <div class="stat"><div class="k">Applicants</div><div class="v">${p.applicants}</div><div class="s">Quorum ${p.quorum} votes each</div></div>
    <div class="stat"><div class="k">Awarded</div><div class="v">${fmt(p.awarded)}<small>${p.asset}</small></div><div class="s">${Math.round(p.awarded/p.budget*100)}% of budget</div></div>
    <div class="stat hl"><div class="k">Released</div><div class="v">${fmt(p.released)}<small>${p.asset}</small></div><div class="s">${p.tranches} tranches per award</div></div>

        <div class="where-figs">

function detailTab(p){
  if (S.tab==='verifiers') return `<table class="t stack"><thead><tr><th>Verifier</th><th>Address</th><th class="r">Signed</th></tr></thead><tbody>
    ${[['Ibadan North extension office','GEXT…7RQA',21],['Oyo East extension office','GEXT…2MLC',15]].slice(0, p.id==='oyo'?2:2).map(v=>`<tr><td><b>${p.id==='oyo'?v[0]:p.verifier}</b><div class="muted" style="font-size:13px">Schema condition-met/v1 · confirms “${p.condition.toLowerCase()}”</div></td><td class="mono">${v[1]} ${copyBtn(v[1])}</td><td class="r num">${v[2]}</td></tr>`).join('')}</tbody></table>
    <p class="muted" style="font-size:13px;margin-top:12px">Verifiers unlock payments. They don't set amounts; reviewers do.</p>`;
  if (S.tab==='terms') return `<dl class="dl">
    <dt>Asset</dt><dd>${p.asset} <span class="muted" style="font-size:13px">(each programme pays in its own asset)</span></dd>
    <dt>Planned payment mode</dt><dd>${modePill(p.mode)} <span class="muted" style="font-size:13px;display:block;margin-top:6px">${MODES[p.mode].line}. Chosen per award at finalize time.</span></dd>

  const rows = [
    ['GD3F…Q7NA',800,3,'Ibadan Agro Supplies'],['GBQ2…M4ZL',400,2,'Ibadan Agro Supplies'],['GCW8…1KHT',650,2,'Oke-Ogun Seeds Ltd'],['GAP5…9XVE',200,3,'Oke-Ogun Seeds Ltd'],['GDL7…3BRS',1200,1,'Ibadan Agro Supplies'],['GBN4…6TQA',500,0,'Oke-Ogun Seeds Ltd']];
  if (!p.awarded) return empty('No awards yet', p.phase==='cancelled'?'This programme was cancelled before any awards were set.':'Awards appear here once reviewers have voted and someone finalizes them.');

function actions(p){
  const act = (name, who, ok, why, btn, data) => `<div class="action"><div class="ah"><div><b>${name}</b><div class="who">${who}</div></div>${ok?`<button class="btn btn-primary btn-sm" data-act="${data}" data-pid="${p.id}">${btn}</button>`:`<button class="btn btn-sm" aria-disabled="true" data-act="nope" data-why="${esc(why)}">${btn}</button>`}</div>${ok?'':reason(why)}</div>`;
  const ph = PH[p.phase];
  const notOpen = `Available only while the programme is Open. This programme is ${p.paused?'paused':''}${p.paused?' and in ':''}${ph}.`;
  if (p.paused) return [
    act('Contribute','Funders',false,notOpen,'Contribute'),
    act('Finalize awards','Anyone',false,'The creator has paused this programme. Finalizing resumes when it is unpaused, before '+p.d[1]+'.','Finalize'),
    act('Release a tranche','Recipients with a proof',false,'Releases start once the programme is Settled.','Release'),
    act('Claim refund','Funders',false,'Refunds open after the release window closes on '+p.d[2]+'.','Claim')].join('');
  return [
    act('Contribute','Funders', p.phase==='open', notOpen, 'Contribute','contribute'),
    act('Apply','Anyone, with the amount they need', p.phase==='open', notOpen, 'Apply','apply'),
    act('Finalize awards','Anyone. This is open on purpose', p.phase==='review', p.phase==='open'?'Finalizing starts when review opens on '+p.d[0]+'.':`Available only during Review. This programme is ${ph}.`, 'Finalize','gofinalize'),
    act('Release a tranche','Recipients with a valid proof', p.phase==='settled'&&!p.closed, p.closed?'The release window closed on '+p.d[2]+'.':(p.phase==='cancelled'?'Nothing can be released from a cancelled programme.':'Releases start once the programme is Settled, after '+p.d[1]+'.'), 'Release','gorecipient'),
    act('Claim refund','Funders, in proportion', p.closed||p.phase==='cancelled', 'Refunds open after the release window closes on '+p.d[2]+'.', 'Claim','refund')
  ].join('');
}

/* contribute flow (sheet) */
let CF = null;
function openContribute(pid){ CF = {pid: (byId(pid)&&byId(pid).phase==='open')?pid:'lakeside', step:'amount', amt:'250', fail:false}; drawSheet(); }
function drawSheet(){
  const host = $('#sheetHost');
  if (!CF && !SI && !TX) { host.innerHTML=''; return; }
  if (SI) return host.innerHTML = signinSheet();
  if (TX) return host.innerHTML = txSheet();
  const p = byId(CF.pid), a = parseFloat(String(CF.amt).replace(/,/g,'')) || 0, bal = 3200;
  const opens = P.filter(x => x.phase==='open' && x.asset==='USDC');
  const dots = ['amount','confirm','pending','done'].map((s,i) => `<i class="${['amount','confirm','pending','done'].indexOf(CF.step)>=i?'on':''}"></i>`).join('');
  let body = '';
  const over = a > bal, zero = a <= 0;
  if (CF.step==='amount') body = `
    <div class="field"><label for="cfP">Programme</label><select class="input" id="cfP">${opens.map(o=>`<option value="${o.id}" ${o.id===p.id?'selected':''}>${o.name}</option>`).join('')}</select><span class="help">Only Open programmes take contributions.</span></div>
    <div class="field"><label for="cfA">Amount</label><div class="amount"><input id="cfA" inputmode="decimal" value="${esc(CF.amt)}" aria-describedby="cfHelp" ${over?'aria-invalid="true"':''}><span class="unit">USDC</span></div>
      <div class="presets">${[50,100,250,500,1000].map(v=>`<button type="button" data-preset="${v}">${fmt(v)}</button>`).join('')}<button type="button" data-preset="${bal}">Max</button></div>
      <span class="help" id="cfHelp">Balance <span class="num">3,200.00 USDC</span> · network fee about 0.0001 XLM, paid by you</span>${over?'<span class="err-text">That’s more than your balance.</span>':''}</div>
    <div class="breakdown" aria-live="polite"><div><span class="muted">You send</span><span class="num">${fmt(a,2)}</span></div><div><span class="muted">Protocol fee (2.5%)</span><span class="num">− ${fmt(a*.025,2)}</span></div><div class="tot"><span>Added to the budget</span><span class="num">${fmt(a*.975,2)} USDC</span></div><div><span class="muted">Your share of contributions</span><span class="num">${((a)/(p.contributed+a)*100||0).toFixed(2)}%</span></div></div>
    <button class="btn btn-primary btn-block" style="margin-top:var(--space-6)" data-act="cfNext" ${over||zero?'disabled':''}>Review contribution</button>`;
  else if (CF.step==='confirm') body = `
    <div class="note ok">${ic('check')}<span><b>Checked on the chain just now: Open.</b> Contributions close ${p.d[0]}.</span></div>
    <div class="receipt"><div><dt>Programme</dt><dd style="font-family:var(--font-sans)">${p.name}</dd></div><div><dt>You send</dt><dd>${fmt(a,2)} USDC</dd></div><div><dt>Fee</dt><dd>${fmt(a*.025,2)} USDC</dd></div><div><dt>Added to budget</dt><dd>${fmt(a*.975,2)} USDC</dd></div></div>
    <p class="muted" style="font-size:13px;margin-top:var(--space-4)">If some of the budget isn’t paid out by ${p.d[2]}, you can claim your proportional share back.</p>
    <div style="display:flex;gap:10px;margin-top:var(--space-6)"><button class="btn btn-ghost" data-act="cfBack">Back</button><button class="btn btn-primary" style="flex:1" data-act="cfSend">${ic('wallet')}Confirm in Freighter</button></div>
    <button class="link" style="font-size:13px;margin-top:14px" data-act="cfFail">Design review: show the failed state</button>`;
  else if (CF.step==='pending') body = `<div class="tx" role="status"><div class="ring pending"></div><h3>Sending ${fmt(a,2)} USDC</h3><p>Approve the transaction in Freighter, then we wait for the network.</p><div class="tx-steps"><span class="ok">${ic('check')}Built and checked</span><span class="on">${ic('wallet')}Waiting for your signature</span><span>${ic('clock')}Confirming on Stellar testnet</span></div></div>`;
  else if (CF.step==='error') body = `<div class="tx"><div class="ring fail">${ic('x')}</div></div>${errorPanel('This programme stopped taking contributions a moment ago. Its apply deadline passed.', 4, 'cfRetry')}`;
  else body = `<div class="tx" role="status"><div class="ring done">${ic('check')}</div><h3>Contribution confirmed</h3><p>${fmt(a*.975,2)} USDC added to ${p.name}.</p>
    <div class="receipt"><div><dt>Sent</dt><dd>${fmt(a,2)} USDC</dd></div><div><dt>Fee</dt><dd>${fmt(a*.025,2)} USDC</dd></div><div><dt>Ledger</dt><dd>1,312,094</dd></div><div><dt>Transaction</dt><dd><a class="link" href="#receipt">9f3a…c21e ${ic('ext','')}</a></dd></div></div>

/* generic tx sheet (release, refund, sign, vote, finalize, deploy) */
let TX = null;
function runTx(o){ TX = Object.assign({state:'pending'}, o); drawSheet(); setTimeout(() => { if (!TX) return; TX.state='done'; drawSheet(); announce(o.doneTitle); if (o.after) o.after(); }, reduce?200:1700); }
function txSheet(){
  const b = TX.state==='pending'
    ? `<div class="tx" role="status"><div class="ring pending"></div><h3>${TX.title}</h3><p>Approve it in Freighter. Nothing moves until the network confirms.</p></div>`

  let awarded = p.awarded + Object.values(S.finalized).reduce((a,b)=>a+b,0);

    <section class="panel"><div class="field" style="margin:0"><label for="finP">Programme in Review</label><select class="input" id="finP">${reviews.map(r=>`<option value="${r.id}" ${r.id===p.id?'selected':''}>${r.name}</option>`).join('')}</select></div>
      <div class="budgetbar" role="img" aria-label="${fmt(awarded)} of ${fmt(p.budget)} awarded"><i style="width:${awarded/p.budget*100}%"></i></div>
      <div style="display:flex;justify-content:space-between;font-size:14px;flex-wrap:wrap;gap:6px"><span><b class="num">${fmt(awarded)}</b> <span class="muted">awarded</span></span><span><b class="num">${fmt(left)}</b> <span class="muted">of ${fmt(p.budget)} ${p.asset} left</span></span></div>
    </section>
    <div class="note risk" role="note" style="align-self:stretch">${ic('alert')}<span><b>This programme is oversubscribed.</b> Applicants asked for ${fmt(asked)} ${p.asset} against ${fmt(p.budget)}. The budget is protected and can’t be exceeded, but <b>whoever finalizes first decides who gets funded</b>. Once the money runs out, the remaining awards can’t be finalized.</span></div>
  </div>
  ${p.paused?`<div class="banner pause">${ic('pause')}<div><b>Paused by the creator.</b> Finalizing is stopped until it’s unpaused. The review still ends on ${p.d[1]}.</div></div>`:''}

    const votes = r[2].map(v=>`<span class="${v===m&&!short_?'md':''}">${fmt(v)}</span>`).join('') + Array.from({length:Math.max(0,r[3]-r[2].length)},()=>'<span class="miss">—</span>').join('');
    let act;
    if (done) act = `<span class="chip-ok">${ic('check')}Finalized · ${S.finMode&&S.finMode[i]||p.mode}</span>`;
    else if (p.paused) act = `<button class="btn btn-sm" aria-disabled="true" data-act="nope" data-why="Paused by the creator.">Finalize</button>`;
    else if (short_) act = `<span class="muted" style="font-size:13px">Needs ${r[3]-r[2].length} more vote${r[3]-r[2].length>1?'s':''}</span>`;

/* ---------------- router & events ---------------- */
function route(){
  let h = (location.hash||'#directory').slice(1) || 'directory';
  if (h.startsWith('programme-')) { S.pid = h.slice(10); h = 'programme'; }
  return h;
}
const root = $('#app');
function draw(focusMain){
  const r = route(); S.route = r;
  root.innerHTML = shell(r);
  document.title = (r==='programme' ? (byId(S.pid)||{name:'Programme'}).name : (NEXT[r] || {directory:'Programmes',fund:'Funding',recipient:'Get funded',verify:'Verify',deploy:'Deploy programme',finalize:'Finalize awards'}[r] || 'Not found')) + ' · Milepost';
  drawSheet();
  if (focusMain) { const m = $('#main'); if (m) m.focus({preventScroll:true}); scrollTo(0,0); }
}
let annT; function announce(t){ const a = $('#announcer'); a.textContent=''; clearTimeout(annT); annT = setTimeout(()=>a.textContent=t, 40); toast(t); }
let toastT; function toast(t){ const h = $('#toastHost'); h.innerHTML = `<div class="toast" aria-hidden="true">${esc(t)}</div>`; clearTimeout(toastT); toastT = setTimeout(()=>h.innerHTML='', 2600); }
addEventListener('hashchange', () => { S.menu=false; draw(true); });

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-filter],[data-view],[data-tab],[data-rtab],[data-claim],[data-wstep],[data-preset],[data-copy]');
  if (!t) { if (S.menu && !e.target.closest('.pop')) { S.menu=false; draw(); } return; }
  if (t.dataset.copy) { try{navigator.clipboard.writeText(t.dataset.copy)}catch(_){} announce('Copied ' + t.dataset.copy); return; }
  if (t.dataset.filter) { S.filter = t.dataset.filter; draw(); announce(`Showing ${S.filter==='all'?'all':PH[S.filter]} programmes`); return; }
  if (t.dataset.view) { S.view = t.dataset.view; S.dockOpen = true; draw(); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; draw(); return; }
  if (t.dataset.rtab) { S.rtab = t.dataset.rtab; if (S.view==='empty') S.view='normal'; draw(); return; }
  if (t.dataset.claim) { S.claim = +t.dataset.claim; draw(); return; }
  if (t.dataset.wstep) { S.wstep = +t.dataset.wstep; draw(); $('#wH') && $('#wH').scrollIntoView({block:'nearest'}); return; }
  if (t.dataset.preset) { CF.amt = fmt(+t.dataset.preset); drawSheet(); return; }
  const a = t.dataset.act;
  switch(a){
    case 'theme': { const h=document.documentElement; h.dataset.theme = h.dataset.theme==='dark'?'light':'dark'; draw(); break; }
    case 'signin': SI='start'; drawSheet(); break;
    case 'siGo': SI='connecting'; drawSheet(); setTimeout(()=>{ SI=null; S.signedIn=true; draw(); announce('Signed in as ' + short(ME)); }, reduce?100:1400); break;
    case 'signout': S.signedIn=false; S.menu=false; draw(); announce('Signed out'); break;
    case 'toggleSign': S.signedIn=!S.signedIn; S.dockOpen=true; draw(); break;
    case 'toggleOff': S.offline=!S.offline; S.dockOpen=true; draw(); break;
    case 'close': if (e.target.closest('a[href]')) { CF=null; SI=null; TX=null; drawSheet(); return; } CF=null; SI=null; TX=null; drawSheet(); break;
    case 'scrim': if (e.target===t) { CF=null; SI=null; if (!TX||TX.state==='done') TX=null; drawSheet(); } break;
    case 'contribute': if (!S.signedIn) { SI='start'; drawSheet(); break; } openContribute(t.dataset.pid); break;
    case 'cfNext': CF.step='confirm'; drawSheet(); break;
    case 'cfBack': CF.step='amount'; drawSheet(); break;
    case 'cfSend': CF.step='pending'; drawSheet(); setTimeout(()=>{ if(!CF) return; CF.step = CF.fail?'error':'done'; drawSheet(); announce(CF.fail?'Contribution failed. Nothing was transferred.':'Contribution confirmed.'); }, reduce?200:2000); break;
    case 'cfFail': CF.fail=true; CF.step='pending'; drawSheet(); setTimeout(()=>{ if(!CF) return; CF.step='error'; drawSheet(); announce('Contribution failed. Nothing was transferred.'); }, reduce?200:1600); break;
    case 'cfRetry': CF.fail=false; CF.step='amount'; drawSheet(); break;
    case 'apply': location.hash='#recipient'; S.rtab='apply'; break;
    case 'gofinalize': S.finP = t.dataset.pid; location.hash='#finalize'; break;
    case 'gorecipient': S.rtab='awards'; location.hash='#recipient'; break;
    case 'refund': runTx({title:'Claiming your refund', doneTitle:'Refund claimed', doneText:`${t.dataset.amt||'Your share'} USDC sent back to your wallet, in proportion to what you put in.`}); break;
    case 'release': runTx({title:'Releasing tranche 2', doneTitle:'Tranche released', doneText:'266.67 USDC paid to Ibadan Agro Supplies. The proof is now used.', after:()=>{S.released.oyo2=true; draw();}}); break;
    case 'pay': runTx({title:'Paying from escrow', doneTitle:'Paid', doneText:'450 USDC sent to the verified payee you chose.', after:()=>{S.released.pay=true; draw();}}); break;
    case 'extend': runTx({title:'Extending your record', doneTitle:'Record extended', doneText:'Your standing stays on the chain for another year.', after:()=>{S.released.extend=true; draw();}}); break;
    case 'applyGo': runTx({title:'Submitting your application', doneTitle:'Application submitted', doneText:'Reviewers will vote after applications close.'}); break;
    case 'withdraw': runTx({title:'Withdrawing application', doneTitle:'Application withdrawn', doneText:'You can apply again while the programme is Open.'}); break;
    case 'vote': runTx({title:'Casting your vote', doneTitle:'Vote recorded', doneText:'3 of 5 votes are now in for this applicant.'}); break;
    case 'revoke': runTx({title:'Revoking attestation', doneTitle:'Attestation revoked', doneText:'It can no longer unlock a tranche.'}); break;
    case 'sign': { if (t.getAttribute('aria-disabled')==='true') { announce('Tick “I checked this myself” first.'); $('#iChecked').focus(); break; } const i=+t.dataset.i; runTx({title:'Signing attestation', doneTitle:'Attestation signed', doneText:'The recipient can now release this tranche.', after:()=>{S.signed[i]=true; draw();}}); break; }
    case 'cant': S.signed[+t.dataset.i]=true; draw(); announce('Removed from your queue. No transaction was sent.'); break;
    case 'fin': { const i=+t.dataset.i; const sel=$('#fm'+i); const mode=sel?sel.value:''; runTx({title:'Finalizing award', doneTitle:'Award finalized', doneText:`${fmt(+t.dataset.m)} USDC awarded, paid in ${mode} mode.`, after:()=>{S.finalized[i]=+t.dataset.m; S.finMode=S.finMode||{}; S.finMode[i]=mode; draw();}}); break; }
    case 'deployGo': runTx({title:'Deploying your programme', doneTitle:'Programme deployed', doneText:'Kano Clinic Nurse Stipends 2027 is Open. It will appear in the directory within a few hours.'}); break;
    case 'trm': S.tr=Math.max(1,(S.tr||3)-1); draw(); break;
    case 'trp': S.tr=Math.min(12,(S.tr||3)+1); draw(); break;
    case 'qm': S.quorum=Math.max(1,S.quorum-1); draw(); break;
    case 'qp': S.quorum=Math.min(4,S.quorum+1); if (S.quorum===4) announce('Quorum can’t be more than your 4 reviewers.'); draw(); break;
    case 'cal': announce('Calendar file with 4 deadlines ready'); break;
    case 'csv': announce('CSV of all awards ready'); break;
    case 'nope': announce(t.dataset.why); break;
    case 'clearq': S.q=''; draw(); break;
    case 'normal': case 'retry': S.view='normal'; draw(); break;
  }
});
document.addEventListener('click', e => { const b = e.target.closest('#acctBtn'); if (b) { e.stopPropagation(); S.menu=!S.menu; draw(); } }, true);
document.addEventListener('input', e => {
  if (e.target.id==='q') { S.q = e.target.value; const pos = e.target.selectionStart; draw(); const q=$('#q'); q.focus(); q.setSelectionRange(pos,pos); }
  if (e.target.id==='cfA') { CF.amt = e.target.value; const pos=e.target.selectionStart; drawSheet(); const i=$('#cfA'); i.focus(); i.setSelectionRange(pos,pos); }
  if (e.target.id==='iChecked') { const b=$('#signBtn'); b.setAttribute('aria-disabled', String(!e.target.checked)); $('#signWhy').hidden = e.target.checked; }
});
document.addEventListener('change', e => {
  if (e.target.id==='sort') { S.sort=e.target.value; draw(); }
  if (e.target.id==='cfP') { CF.pid=e.target.value; drawSheet(); }
  if (e.target.id==='finP') { S.finP=e.target.value; S.finalized={}; draw(); }
  if (e.target.name==='mode') { S.mode=e.target.value; }
});
document.addEventListener('keydown', e => { if (e.key==='Escape') { if (CF||SI||(TX&&TX.state==='done')) { CF=null; SI=null; TX=null; drawSheet(); } else if (S.menu) { S.menu=false; draw(); $('#acctBtn')&&$('#acctBtn').focus(); } } });

try { if (!document.documentElement.dataset.theme) document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch(_) { document.documentElement.dataset.theme='light'; }
draw();

/* batch 2 events */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-atby],[data-atsel],[data-rmfield],[data-rmpayee],[data-kext]');
  if (t) {
    if (t.dataset.atby) { S.atBy=t.dataset.atby; S.atSel=0; draw(); }
    else if (t.dataset.atsel) { S.atSel=+t.dataset.atsel; draw(); }
    else if (t.dataset.rmfield) { S.fields=(S.fields||[['programme','address'],['tranche','u32'],['reference','string']]).filter((_,i)=>i!==+t.dataset.rmfield); draw(); announce('Field removed'); }
    else if (t.dataset.rmpayee) { const pid=S.payP||'oyo'; const cur=(S.payees&&S.payees[pid])||[...document.querySelectorAll('table.t tbody tr')].map(r=>[r.cells[0].innerText,r.cells[1].innerText.trim(),r.cells[2].innerText]); const i=+t.dataset.rmpayee; runTx({title:'Removing payee', doneTitle:'Payee removed', doneText:cur[i][0]+' can no longer be paid by this programme.', after:()=>{S.payees=S.payees||{}; S.payees[pid]=cur.filter((_,k)=>k!==i); draw();}}); }
    else if (t.dataset.kext) { const id=t.dataset.kext; runTx({title:'Extending stored data', doneTitle:'Extended', doneText:byId(id).name+' data now lasts another year.', after:()=>{S.kExt=Object.assign({},S.kExt,{[id]:1}); draw();}}); }
    return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  switch (a.dataset.act) {
    case 'rcptNF': S.rcpt='notfound'; draw(); announce('No receipt found for that hash.'); break;
    case 'printish': announce('Receipt copied as text'); break;
    case 'propGh': e.preventDefault(); S.propDone='Opened a pre-filled GitHub issue in a new tab.'; draw(); announce('Opened a pre-filled GitHub issue'); break;
    case 'propMail': e.preventDefault(); S.propDone='Opened your mail app with the summary. If nothing opened, use Copy summary.'; draw(); announce('Opening your mail app'); break;
    case 'policyGo': runTx({title:'Installing spend policy', doneTitle:'Policy installed', doneText:'Your smart wallet now only spends USDC, to verified payees, up to 1,800.', after:()=>{S.policy=true; draw();}}); break;
    case 'addField': S.fields=(S.fields||[['programme','address'],['tranche','u32'],['reference','string']]).concat([['new_field','string']]); draw(); break;
    case 'schemaGo': runTx({title:'Registering schema', doneTitle:'Schema registered', doneText:'shifts-worked/v1 can now be chosen when deploying a programme.'}); break;
    case 'addPayee': { const n=($('#pyn')||{}).value, ad=($('#pya')||{}).value; if(!n||!ad){ announce('Add a name and a Stellar address first.'); (n?$('#pya'):$('#pyn')).focus(); break; } const pid=S.payP||'oyo'; const cur=(S.payees&&S.payees[pid])||[...document.querySelectorAll('table.t tbody tr')].map(r=>[r.cells[0].innerText,r.cells[1].innerText.trim(),r.cells[2].innerText]); runTx({title:'Verifying payee', doneTitle:'Payee verified', doneText:n+' can now be paid by this programme.', after:()=>{S.payees=S.payees||{}; S.payees[pid]=cur.concat([[n, ad.length>12?ad.slice(0,4)+'…'+ad.slice(-4):ad,'16 Nov 2026']]); draw();}}); break; }
    case 'extAll': runTx({title:'Extending stored data', doneTitle:'Extended', doneText:'Every programme under 30 days now lasts another year.', after:()=>{S.kExt=Object.assign({},S.kExt,{kilifi:1,accra:1}); draw();}}); break;
    case 'stNF': S.stFound=false; draw(); break;
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  if (f.dataset.form==='rcpt') { const v=($('#rh').value||'').trim(); if(!v){ announce('Paste a transaction hash first.'); $('#rh').focus(); return; } S.rcpt='loading'; draw(); setTimeout(()=>{ S.rcpt='found'; draw(); announce('Receipt found: contribution of 250 USDC.'); }, reduce?100:900); }
  if (f.dataset.form==='att') { draw(); announce('Attestation results updated'); }
  if (f.dataset.form==='st') { S.stFound=true; draw(); announce('Standing found: 3 programmes'); }
});
document.addEventListener('change', e => { if (e.target.id==='payP') { S.payP=e.target.value; draw(); } });

})();
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('dock')) window.__dock = e.target.open; }, true);
</script></body></html>
