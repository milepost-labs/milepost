    <!-- Content Security Policy: restrict script sources and API endpoints.
         - default-src 'self': sandbox to this origin
         - script-src 'self': only scripts from this origin (no inline; vite handles bundling)

         - font-src https://fonts.gstatic.com: fonts from Google's CDN

    -->
