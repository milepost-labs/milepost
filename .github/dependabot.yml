# Dependabot configuration for Milepost workspace ecosystems
#
# Exception Note:
# Cargo workspace member `milepost-policy-spend` (contracts/policy-spend/Cargo.toml)
# depends on `smart-wallet-interface` pinned to a specific git commit revision:
#   smart-wallet-interface = { git = "https://github.com/stellar/passkey-kit", rev = "..." }
# Dependabot cannot automatically detect or bump git-pinned Rust dependencies.
# Updates to this dependency must be manually reviewed and tested against upstream interface changes.

version: 2
updates:
  # Cargo workspace (contracts & crates)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  # Generated TypeScript SDK Packages
  - package-ecosystem: "npm"
    directory: "/packages/attest"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      package-attest-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/packages/policy-spend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      package-policy-spend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/packages/program"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      package-program-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/packages/record"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      package-record-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/packages/registry"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      package-registry-dependencies:
        patterns:
          - "*"

  # The web app, vendored into frontend/ for the wave. Minor and patch only, so
  # one major that needs work cannot hold back a batch of safe updates; majors
  # arrive as their own PRs. frontend/.github/dependabot.yml keeps the same
  # policy for when the app moves back to its own repository.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      milepost-bindings:
        patterns:
          - "@milepost/*"
      frontend-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint only supports TypeScript below 6.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The types should describe the Node version CI runs.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-dependencies:
        patterns:
          - "*"
