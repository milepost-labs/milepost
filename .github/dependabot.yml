# Dependabot configuration for Milepost workspace ecosystems
#
# One PR per ecosystem per month, minor and patch only. Major versions are
# migrations (soroban-sdk changes the contract wasm, stellar-sdk 17 changes the
# bindings' public API, vitest and TypeScript majors need tooling work), so they
# are done by hand, not proposed by a bot. Security updates are separate from
# this schedule and still open as soon as an advisory is published.
#
# Exception Note:
# Cargo workspace member `milepost-policy-spend` (contracts/policy-spend/Cargo.toml)
# depends on `smart-wallet-interface` pinned to a specific git commit revision:
#   smart-wallet-interface = { git = "https://github.com/stellar/passkey-kit", rev = "..." }
# Dependabot cannot automatically detect or bump git-pinned Rust dependencies.
# Updates to this dependency must be manually reviewed and tested against upstream interface changes.

version: 2
updates:
  # Cargo workspace (contracts & crates)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Generated TypeScript SDK packages, all five in one PR. Their dependencies
  # only reach users when a new @milepost/* version is released.
  - package-ecosystem: "npm"
    directories:
      - "/packages/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      packages-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The web app, vendored into frontend/ for the wave. frontend/.github/
  # dependabot.yml holds the app's own policy for when it moves back to its own
  # repository.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      # First, because Dependabot puts a dependency in the first group it
      # matches. A new @milepost/* version is a contract interface change and
      # should arrive as its own PR, not inside a batch of tooling bumps.
      milepost-bindings:
        patterns:
          - "@milepost/*"
      frontend-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions-dependencies:
        patterns:
          - "*"
