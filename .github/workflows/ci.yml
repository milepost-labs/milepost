name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

# Read-only by default. No job here pushes, comments or edits anything; a job
# that ever needs more must grant it on itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (branch, pinned at this commit)
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        run: cargo fmt --all --check

      # cargo-audit itself, not rustsec/audit-check: the action also publishes
      # its result as a separate "Security audit" check run, and updating that
      # run failed with "Not Found" on push even when the audit was clean, which
      # turned this job red on a green audit. Accepted advisories, each with its
      # reason, are in .cargo/audit.toml. A prebuilt binary, because
      # `cargo install cargo-audit` compiles from source on every run.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-audit

      - name: Check dependencies for known vulnerabilities
        run: cargo audit

      # Licences, duplicate versions and source registries, against deny.toml.
      # Advisories stay with cargo-audit above. A prebuilt binary, as above.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-deny
      - name: Check licences, bans and sources
        run: cargo deny check licenses bans sources

      # Must precede both Clippy and Test. The registry's tests instantiate the
      # programme from its built wasm, the same way the registry does on-chain,
      # so the artifact has to exist before anything compiles a test target —
      # and `clippy --all-targets` compiles test targets too. Contracts are also
      # billed by deployed size, so building here beats discovering it at deploy
      # time.
      - name: Build wasm
        run: cargo build --target wasm32v1-none --release

      - name: Validate contract documentation
        run: ./scripts/check-docs.sh

      # An error variant no test asserts is a guard nobody would notice
      # removing. Unreachable variants are allowlisted with a reason in
      # scripts/untested-errors-allowlist.txt; stale entries fail too.
      - name: Check every contract error is tested
        run: |
          python3 scripts/check-untested-errors.test.py
          ./scripts/check-untested-errors.py

      # Bindings in packages/ are generated from this wasm and checked in. If a
      # contract interface changes and nobody regenerates them, the frontend
      # only finds out after a transaction is already submitted. Fail here
      # instead. `networks.testnet` on the four singletons is ignored so a
      # wasm-only regeneration cannot fail for the missing address.
      - uses: stellar/stellar-cli@300aaf69ab100536678bdb641428b06f06b318ea # v28.0.0
      - name: Check TypeScript bindings
        run: ./scripts/check-bindings.sh

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Report contract sizes
        run: |
          echo "| contract | bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"
          for f in target/wasm32v1-none/release/*.wasm; do
            printf '| %s | %s |\n' "$(basename "$f" .wasm)" "$(stat -c%s "$f")" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Enforce contract size budgets
        run: ./scripts/check-sizes.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage
        env:
          # Actual line coverage is about 98%; this leaves real headroom while
          # still catching a meaningful regression.
          COVERAGE_THRESHOLD: "90"
        run: |
          # `--fail-under-lines` does the threshold check itself. Parsing the
          # percentage out of the text table is fragile — the TOTAL row carries
          # region, function and line figures, and a grep takes whichever comes
          # first.
          #
          # Run without `set -e` so the report still reaches the job summary
          # when the gate fails; that is exactly when someone needs to read it.
          set +e
          cargo llvm-cov --all-features --summary-only \
            --output-path /tmp/coverage-summary.txt \
            --fail-under-lines "$COVERAGE_THRESHOLD"
          status=$?
          set -e

          echo "### Coverage report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
          # The report has no trailing newline, so the closing fence would
          # otherwise land on the TOTAL row.
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 0 ]; then
            echo "::error::Line coverage is below the ${COVERAGE_THRESHOLD}% threshold"
          fi
          exit $status
          echo "### Coverage report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Fail if total coverage drops below threshold (update after recording
          # the current figure in your PR description).
          TOTAL=$(grep -oP 'TOTAL.*\K[0-9.]+(?=%)' /tmp/coverage-summary.txt || echo "0")
          THRESHOLD="${COVERAGE_THRESHOLD:-70}"
          if (( $(echo "$TOTAL < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage $TOTAL% is below the $THRESHOLD% threshold"
            exit 1
          fi

  bindings:
    runs-on: ubuntu-latest
    # The app lives in frontend/ and the indexer in its own repository, and both
    # install published @milepost/* versions, so neither sees a contract change
    # that has not been released. This job builds the bindings from this
    # checkout, checks what a release would upload, and builds and tests both
    # against those builds, so a PR here that would break the app, or stop the
    # indexer decoding an event, fails here rather than after the next release
    # reaches them.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: milepost-labs/milepost-indexer
          path: milepost-indexer
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Build bindings and install them into both consumers
        run: ./scripts/frontend-with-local-bindings.sh frontend milepost-indexer

      # Nothing else inspects what `npm publish` would actually upload. A
      # package that ships without dist/ installs cleanly and only fails when a
      # consumer imports it, so check the tarball on every PR rather than
      # discovering it when a release tag is pushed.
      - name: Verify bindings are publishable
        run: ./scripts/check-bindings-publishable.sh

      # The file list above cannot see a broken `exports` map, a missing type
      # file or an ESM-only import. Install the real tarballs into an empty
      # project and use them the way an integrator would.
      - name: Install, import and typecheck each binding package
        run: ./scripts/check-bindings-consumable.sh

      # Every contract error must have a plain-language explanation in the app,
      # and the app must not explain a code the contracts no longer have.
      - name: Check the app explains every contract error
        run: python3 ./scripts/check-error-parity.py

      - name: Build the app against local bindings
        run: npm run build --prefix frontend

      - name: Enforce the app's bundle size budget
        run: ./frontend/scripts/check-bundle-size.sh >> "$GITHUB_STEP_SUMMARY"

      # The component gallery at /dev/ui is for development builds only.
      - name: Check no development-only pages reached the build
        run: ./frontend/scripts/check-no-dev-pages.sh

      # Every page and component CSS file must use design tokens for colours and
      # spacing on the 4px scale.
      - name: Check page and component CSS uses design tokens
        run: node frontend/scripts/check-design-system.mjs

      - name: Test the design-system guard
        run: npm run test:design-system --prefix frontend

      # Every stand-in value on screen carries a "Sample data" tag. A component
      # that reads a FIXTURE_* export without rendering the tag fails here,
      # unless frontend/scripts/sample-tag-allowlist.json says why it may.
      - name: Check fixtures are rendered with the sample tag
        run: npm run check:sample-tags --prefix frontend

      - name: Test the sample-tag check
        run: npm run test:sample-tags --prefix frontend

      # Not cosmetic. The React Compiler rules here catch render-purity and
      # cascading-setState bugs that type-check cleanly and misbehave at runtime.
      - name: Lint the app
        run: npm run lint --prefix frontend

      # Runs the suite once, with coverage. Vitest fails the step on a failing
      # test or on coverage below the floors in frontend/vite.config.ts.
      #
      # Run without `set -e` so the report still reaches the job summary when
      # the gate fails; that is exactly when someone needs to read it.
      - name: Test the app against local bindings, with coverage
        run: |
          set +e
          npm run test:coverage --prefix frontend
          status=$?
          set -e

          if [ -f frontend/coverage/coverage-summary.json ]; then
            node frontend/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$status" -ne 0 ]; then
            echo "::error::App tests failed or coverage fell below the floor in frontend/vite.config.ts"
          fi
          exit $status

      # The app has its own lockfile and its own copy of the advisory policy;
      # the five binding lockfiles are checked at the end of this job.
      - name: Check the app's dependencies for known advisories
        run: ./frontend/scripts/check-npm-advisories.sh

      # The indexer decodes events with the spec each binding embeds, so a
      # renamed event or a changed field breaks it silently at runtime. Its
      # tests replay recorded and constructed events through those specs, which
      # is what catches that here.
      - name: Typecheck milepost-indexer against local bindings
        run: npm run typecheck --prefix milepost-indexer

      - name: Test milepost-indexer against local bindings
        run: npm test --prefix milepost-indexer

      # Five independent lockfiles, one per binding package. Apps build and
      # sign transactions with these packages, so a compromised production
      # dependency in them reaches transaction construction. The failure policy
      # is deliberate and documented in scripts/check-npm-advisories.sh, which
      # is the only place that needs to change when the policy changes.
      - name: Check npm dependencies for known advisories
        run: ./scripts/check-npm-advisories.sh

      # The examples/ scripts show integrators how to call the published
      # packages. Typecheck them against this checkout's bindings, built by the
      # first step, so a binding change that would break them fails here.
      - name: Typecheck examples against local bindings
        run: ./scripts/typecheck-examples.sh

  accessibility:
    name: Accessibility checks
    runs-on: ubuntu-latest
    # Every route, in both themes, on every PR to dev. Also runs on a push to
    # dev or main, so a merge that breaks the check is caught on the branch
    # rather than at the next PR.
    if: github.event_name != 'pull_request' || github.base_ref == 'dev'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --prefix frontend

      # Renders every route in src/routes.ts in jsdom, in light and dark, with
      # the contracts and the index mocked, and fails on a serious or critical
      # axe violation. See frontend/src/test/accessibility.test.tsx and
      # frontend/CONTRIBUTING.md.
      - name: Check every route with axe
        run: npm run test:a11y --prefix frontend

  network:
    name: Network setting checks
    runs-on: ubuntu-latest
    # The app's network is one setting, src/config/network.ts, fixed per build
    # by VITE_NETWORK. Every PR to dev, and every push to dev or main, checks
    # that nothing else names testnet and that the mainnet build still builds
    # and carries no sample data. See frontend/CONTRIBUTING.md.
    if: github.event_name != 'pull_request' || github.base_ref == 'dev'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --prefix frontend

      # Includes the no-restricted-syntax rule in frontend/eslint.config.js that
      # rejects networks.testnet and testnet URLs outside src/config/ and tests.
      - name: Lint, including no testnet literals outside the network setting
        run: npm run lint --prefix frontend

      # VITE_NETWORK=mainnet with placeholder ids, then fails if any address or
      # contract id from frontend/src/fixtures/ is in the output.
      - name: Build for mainnet and check no sample id reached it
        run: npm run check:mainnet-build --prefix frontend

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    # Real browser, production headers from frontend/vercel.json. Smoke: every
    # route loads with no uncaught or console error and no CSP violation.
    # Reflow: no sideways page scroll at 320px, signed in and signed out.
    # See frontend/tests/browser and "Browser checks" in CONTRIBUTING.md.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --prefix frontend

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Build the signed-in and signed-out builds
        working-directory: frontend
        run: npm run build:browser

      - name: Run the browser checks
        working-directory: frontend
        run: npm run test:browser

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-checks-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  malware:
    name: Malware check
    runs-on: ubuntu-latest
    # Read-only, and it installs nothing: the check has no dependencies, so a
    # hostile package in a PR's lockfile is looked up, never run.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # Known-malicious packages (OSV MAL- entries) in every lockfile, new
      # install scripts, packages from outside the registries, worm files,
      # pull_request_target workflows and hidden Unicode. Exceptions go in
      # .github/malware-check-allowlist.json with a reason. See the header of
      # scripts/check-malware.mjs.
      - name: Check for supply-chain malware
        run: node scripts/check-malware.mjs

      - name: Test the malware check
        run: node --test scripts/check-malware.test.mjs
