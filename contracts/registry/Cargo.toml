[package]
name = "milepost-registry"
description = "Factory and protocol configuration for Milepost programmes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
milepost-types = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
milepost-record = { path = "../record", features = ["testutils"] }
milepost-attest = { path = "../attest", features = ["testutils"] }
milepost-test-utils = { path = "../../crates/test-utils", features = ["testutils"] }
