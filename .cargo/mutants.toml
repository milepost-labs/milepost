# cargo-mutants configuration. How to run it, and how to read the report, is in
# docs/testing-guide.md#mutation-testing.
#
# Scope the contracts whose state directly controls funding, standing, or
# restricted spending. Add another contract only with its own survivor review.
examine_globs = [
  "contracts/program/src/**/*.rs",
  "contracts/registry/src/**/*.rs",
  "contracts/attest/src/**/*.rs",
  "contracts/record/src/**/*.rs",
  "contracts/policy-spend/src/**/*.rs",
]
exclude_globs = [
  "contracts/program/src/test.rs",
  "contracts/program/src/*_test.rs",
  "contracts/registry/src/test.rs",
  "contracts/registry/src/*_test.rs",
  "contracts/attest/src/test.rs",
  "contracts/attest/src/*_test.rs",
  "contracts/record/src/test.rs",
  "contracts/record/src/*_test.rs",
  "contracts/policy-spend/src/test.rs",
  "contracts/policy-spend/src/*_test.rs",
]
test_package = [
  "milepost-program",
  "milepost-registry",
  "milepost-attest",
  "milepost-record",
  "milepost-policy-spend",
]

# The proptests are skipped. With random inputs a mutant can be caught on one run
# and survive the next, so the verdict — and the build — would flap. A mutant
# counts as caught only when a deterministic example test catches it, which also
# means every surviving mutant is fixed by adding an example that names the case.
additional_cargo_test_args = ["--", "--skip", "proptests"]

# Mutants that no test can catch because they do not change behaviour. Each entry
# says why; anything not listed here that survives is a missing test.
#
# Entries name the line and column because the same operator swap elsewhere in
# the function is a real mutant that tests do catch. When an edit moves the line,
# the entry stops matching and the mutant is reported as surviving again: that is
# the prompt to re-check the reasoning and update the position, never to delete
# the entry unread.
exclude_re = [
  # release_batch: `if award.tranches > 0` -> `>=`. The two differ only when an
  # award has zero tranches, and the constructor refuses `tranches == 0`, which
  # every award copies from the config. Unreachable, so equivalent.
  'lib\.rs:1484:48: replace > with >= in Programme::release_batch$',
  # review, amending and new-vote branches: `approved < existing` -> `<=` when
  # finding where to insert a vote. The two differ only in whether a vote goes
  # before or after an equal one, and equal i128s are indistinguishable, so the
  # sorted vector — and the median taken from it — is identical either way.
  'lib\.rs:865:29: replace < with <= in Programme::review$',
  'lib\.rs:892:29: replace < with <= in Programme::review$',
  # extend_release_deadline: `new_release_deadline > config.sweep_deadline` -> `>=`.
  # When the new deadline equals the current sweep deadline, both branches keep
  # the same value, so the mutant is behaviour-preserving and equivalent.
  'lib\.rs:1808:38: replace > with >= in Programme::extend_release_deadline$',
]
